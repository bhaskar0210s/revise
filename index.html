<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Revise</title>
  <meta name="description" content="Week-by-week revision for Statistics, Mathematics, English and Python, with labs and a formula sheet. Works on a phone, offline.">
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Revise">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="app.css">
  <script>
    // saved theme and text size before the first paint
    try {
      var s = JSON.parse(localStorage.getItem('revise.v1')) || {}, d = document.documentElement;
      if (s.theme && s.theme !== 'auto') d.setAttribute('data-theme', s.theme);
      if (s.size) d.style.setProperty('--size', s.size);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="bar" id="bar">
    <a class="bar-back" id="back" href="#/" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <a class="bar-brand" href="#/" aria-label="Revise home"><span class="bar-mark" aria-hidden="true"></span><span class="bar-name">Revise</span></a>
    <div class="bar-title" id="bar-title"></div>
    <button class="bar-btn" id="search-btn" type="button" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    <button class="bar-btn" id="settings-btn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>
  <main id="view" tabindex="-1"></main>
  <div class="sheet-scrim" id="scrim" hidden></div>
  <noscript><p class="noscript">Revise needs JavaScript turned on.</p></noscript>
  <script src="vendor/katex/katex.min.js" defer></script>
  <script src="app.js" defer></script>
  <script src="data/site.js" defer></script>
  <script src="labkit.js" defer></script>
  <script>
    addEventListener('DOMContentLoaded', function () { REV.start(); });
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
