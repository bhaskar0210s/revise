  <script>
    // apply the saved theme, text size, page width and sidebar state before first paint
    try {
      var s = JSON.parse(localStorage.getItem('statslab.v1')) || {}, d = document.documentElement;
      if (s.theme && s.theme !== 'auto') d.setAttribute('data-theme', s.theme);
      d.setAttribute('data-width', s.width || 'full');
      if (s.sideHidden) d.setAttribute('data-side', 'hidden');
      if (s.zoom) d.style.setProperty('--zoom', s.zoom);
      if (s.dockW) d.style.setProperty('--dock-w', s.dockW + 'px');
    } catch (e) {}
  </script>
